<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Results | GEHU Quiz</title>
<link rel="stylesheet" href="admin-results.css">
</head>

<body>

<div class="admin-layout">

    <aside class="admin-sidebar">

        <img src="gehu-logo.png" class="admin-logo" alt="GEHU Logo">

        <h2>Admin Panel</h2>

        <a href="admin-dashboard.html">🏠 Dashboard</a>
        <a href="manage-questions.html">📝 Manage Questions</a>
        <a href="manage-students.html">👥 Students</a>
        <a class="active" href="admin-results.html">📊 Results</a>
        <a href="leaderboard.html">🏆 Leaderboard</a>
        <a href="logout.html">🚪 Logout</a>

    </aside>

    <main class="admin-main">

        <div class="page-header">
            <div>
                <h1>Quiz Results</h1>
                <p>View all student quiz attempts and scores.</p>
            </div>

            <div class="count-box">
                Total Attempts: <span id="attemptCount">0</span>
            </div>
        </div>

        <section class="results-table-card">

            <div class="table-header">
                <h2>All Results</h2>
                <input type="text" id="searchResult" placeholder="Search result..." onkeyup="searchResults()">
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student Name</th>
                        <th>Quiz</th>
                        <th>Date</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="resultsTable"></tbody>
            </table>

        </section>

    </main>

</div>

<script src="admin-auth.js"></script>
<script src="admin-results.js"></script>

</body>
</html>
