<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Result | GEHU Quiz</title>
<link rel="stylesheet" href="result.css">
</head>

<body>

<div class="result-container">

    <div class="result-card">

        <img src="gehu-logo.png" class="logo" alt="GEHU Logo">

        <h1>Quiz Completed 🎉</h1>
        <p>Your performance summary is ready.</p>

        <div class="score-circle">
            <h2 id="scoreText">0/0</h2>
            <span id="percentageText">0%</span>
        </div>

        <div class="result-status" id="statusText">
            Status
        </div>

        <div class="result-grid">

            <div class="result-box">
                <h3 id="correctText">0</h3>
                <p>Correct</p>
            </div>

            <div class="result-box">
                <h3 id="wrongText">0</h3>
                <p>Wrong</p>
            </div>

            <div class="result-box">
                <h3 id="totalText">0</h3>
                <p>Total</p>
            </div>

        </div>

        <div class="result-buttons">
            <a href="dashboard.html">Dashboard</a>
            <a href="quiz.html">Try Again</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="history.html">History</a>
        </div>

    </div>

</div>

<script src="result.js"></script>

</body>
</html>
