<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | GEHU Quiz</title>
<link rel="stylesheet" href="register.css">
</head>

<body>

<div class="register-card">
    <img src="gehu-logo.png" class="logo" alt="GEHU Logo">

    <h1>Create Student Account</h1>
    <p>Register yourself to start GEHU Quiz</p>

    <form id="registerForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Personal Email ID" required>
        <input type="password" id="password" placeholder="Create Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit">Register</button>
    </form>

    <p class="login-text">
        Already registered? <a href="login.html">Login here</a>
    </p>

    <p id="message"></p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let message = document.getElementById("message");

    if(password !== confirmPassword){
        message.innerText = "Passwords do not match!";
        message.style.color = "red";
        return;
    }

    let student = {
        name: name,
        email: email,
        password: password
    };

    localStorage.setItem("student", JSON.stringify(student));

    message.innerText = "Registration successful! Redirecting to login...";
    message.style.color = "green";

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);
});
</script>

</body>
</html>
